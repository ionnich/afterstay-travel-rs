# Pull-only CI smoke test.
#
# This workflow deliberately builds NOTHING. All real work — cargo fmt/clippy/test,
# docker build, docker push, client tsc — happens locally via `./oracle.sh ci`
# (or `make ci`) on a machine with the Rust/Docker/Node toolchains. GitHub runners
# only PULL the pre-built ECR images and assert they exist, so the workflow stays
# cheap and never embeds build secrets.
#
# OIDC role `github-actions-role` (ECR read-only, trust scoped to this repo)
# is already provisioned. Fallback: the secrets-based login in the login step.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  pull-smoke:
    name: Pull ECR images
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::755251749545:role/github-actions-role
          role-session-name: afterstay-ci
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin 755251749545.dkr.ecr.ap-southeast-1.amazonaws.com
        # Alternative without OIDC: provide AWS creds as repo secrets and login via
        # `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` (the `afterstay` profile).

      - name: Pull and inspect images
        env:
          ECR_REGISTRY: 755251749545.dkr.ecr.ap-southeast-1.amazonaws.com
        run: |
          for image in api integrations chat; do
            docker pull "$ECR_REGISTRY/afterstay/$image:latest"
            docker image inspect "$ECR_REGISTRY/afterstay/$image:latest" >/dev/null
            echo "ok: afterstay/$image"
          done
